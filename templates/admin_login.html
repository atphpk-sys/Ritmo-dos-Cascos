<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login — Ritmo Dos Cascos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #3e2723, #6d4c41);
  }
  .card {
    background: #fdf6ec;
    padding: 40px 36px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    width: 340px;
    text-align: center;
  }
  .card h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: #4e342e;
    margin: 0 0 4px;
  }
  .card p.sub {
    color: #8d6e63;
    font-size: 13px;
    margin: 0 0 24px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #d7ccc8;
    margin-bottom: 14px;
    font-size: 14px;
    font-family: inherit;
  }
  input[type="password"]:focus { outline: 2px solid #a1887f; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #6d4c41;
    color: #fff;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover { background: #4e342e; }
  .erro {
    background: #ffe1e1;
    color: #b3261e;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🐴 Ritmo Dos Cascos</h1>
    <p class="sub">Painel administrativo</p>
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
    <form method="POST">
      <input type="password" name="senha" placeholder="Digite a senha">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
